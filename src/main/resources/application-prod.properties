spring.application.name=atleti-news

# PostgreSQL (Supabase) Database Configuration
# 운영 환경에서는 환경 변수를 사용하는 것이 보안상 가장 안전합니다.
# 직접 입력하고 싶으시다면 ${...} 부분을 지우고 실제 값을 넣으시면 됩니다.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driverClassName=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Gemini API Configuration
gemini.api.key=${GEMINI_API_KEY}

# RapidAPI Configuration
rapidapi.key=${RAPIDAPI_KEY}
rapidapi.twitter.host=twitter-api45.p.rapidapi.com
rapidapi.football.host=free-api-live-football-data.p.rapidapi.com
rapidapi.daily.limit=45

# 운영 환경에서는 로그를 간결하게 유지합니다.
logging.level.org.hibernate.SQL=ERROR
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=ERROR

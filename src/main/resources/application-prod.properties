# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://${DB_HOST}:5432/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driverClassName=org.postgresql.Driver

# JPA / Hibernated
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Gemini API Configuration
gemini.api.key=${GEMINI_API_KEY}
gemini.api.model=gemini-2.5-flash-lite

# RapidAPI Configuration
rapidapi.key=${RAPIDAPI_KEY}
rapidapi.twitter.host=twitter-api45.p.rapidapi.com
rapidapi.football.host=free-api-live-football-data.p.rapidapi.com
rapidapi.daily.limit=3300

# 운영 최적화
logging.level.org.hibernate.SQL=ERROR
server.forward-headers-strategy=framework

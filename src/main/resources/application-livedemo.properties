# 라이브 피드 로컬 리허설 프로파일 (scripts/fake-live-match.js와 짝)
#
# 경기가 없는 날에도 폴러·매핑·골 diff·VAR 취소·FotMob 폴백을 실제 코드 경로 그대로
# 돌려보기 위한 것. 외부 주소만 가짜 서버로 갈아끼우고 나머지는 운영과 동일하게 둔다.
#
#   1) node scripts/fake-live-match.js
#   2) ./gradlew bootRun --args='--spring.profiles.active=h2,livedemo'
#
# 운영에서는 절대 켜지 않는다 (prod 프로파일과 함께 쓰면 상류가 localhost로 바뀐다).

atleti.source.naver-base-url=http://localhost:8099
atleti.source.fotmob-base-url=http://localhost:8099

# 가짜 경기 방을 바로 열어 두기 위한 것 — 폴러는 이 값과 무관하게 킥오프 시각으로 판단한다
atleti.chat.always-open=true

# 리허설 중에는 뉴스·유튜브 파이프라인이 같이 돌 이유가 없다 (외부 쿼터 낭비)
atleti.news.enabled.twitter=false
atleti.news.enabled.news=false
atleti.news.enabled.gemini=false
atleti.news.enabled.youtube=false
atleti.news.enabled.headline=false

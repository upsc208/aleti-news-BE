spring.application.name=atleti-news

# H2 File-based Database Configuration (AUTO_SERVER=TRUE 추가로 동시 접속 허용)
spring.datasource.url=jdbc:h2:file:./data/atletidb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_UPPER=FALSE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

# JPA / Hibernate (update: 기존 테이블 유지 및 스키마 변경점만 적용)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Gemini API Configuration
gemini.api.key=${GEMINI_API_KEY:NO_KEY}

# RapidAPI Configuration
rapidapi.key=${RAPIDAPI_KEY:NO_KEY}
rapidapi.twitter.host=twitter-api45.p.rapidapi.com
rapidapi.football.host=free-api-live-football-data.p.rapidapi.com
# 일일 최대 호출 제한 (무료 티어가 50회라면 안전하게 45회로 설정)
rapidapi.daily.limit=45

# 2026 Atletico Madrid News Keywords (1군 및 주요 유스 선수 반영)
atleti.news.keywords=atleti,atletico, Atlético de Madrid, Atlético, simeone,cholo,rojiblanco,metropolitano,atm,fichaje,mercado,official,exclusiva,\
  alvarez,julian, Julián, Álvarez, sorloth,griezmann,llorente,koke,oblak,barrios,le normand,gimenez, lookman, jonny cardoso, ruggeri,obed, obed vargas, nico Gonzalez\
  molina,kostis,giuliano,mendoza, baena, almada, pubill, hancko, juan musso, julio diaz, lenglet, \
  saul, godin, gabi, Fernando Torres, Luis Aragones, Falcao, Deigo Costa, Filipe Luis, carrasco


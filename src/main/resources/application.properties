spring.application.name=atleti-news

# H2 File-based Database Configuration
spring.datasource.url=jdbc:h2:file:./data/atletinews;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_UPPER=FALSE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Gemini API Configuration
gemini.api.key=e7497697e4mshbde56e95e2d9f60p1fb4b4jsn3b6892a5975e

# RapidAPI Configuration
rapidapi.key=YOUR_RAPIDAPI_KEY_HERE
rapidapi.twitter.host=twitter-api45.p.rapidapi.com
# 일일 최대 호출 제한 (무료 티어가 50회라면 안전하게 45회로 설정)
rapidapi.daily.limit=45

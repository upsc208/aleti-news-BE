spring.application.name=atleti-news

# --- Profile Selection ---
# 기본값은 로컬 개발용 h2. 운영은 systemd가 --spring.profiles.active=prod로 직접 지정하므로
# 배포한다고 이 값을 바꿀 필요 없음 ("배포용으로 변경" 커밋 불필요)
spring.profiles.active=h2

# --- Common Configurations ---
# Redis (전 프로파일 공통 — 운영은 apt 설치본, 로컬은 Docker. docs/redis-design.md 참고)
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Gemini API Configuration
gemini.api.key=${GEMINI_API_KEY:NO_KEY}
gemini.api.model=gemini-2.5-flash-lite

# RapidAPI Configuration
rapidapi.key=${RAPIDAPI_KEY:NO_KEY}
rapidapi.twitter.host=twitter-api45.p.rapidapi.com
rapidapi.football.host=free-api-live-football-data.p.rapidapi.com
rapidapi.daily.limit=3300

# SerpApi Configuration
serpapi.key=${SERPAPI_KEY:NO_KEY}

# API-Football (Direct API-Sports)
football.api.key=${FOOTBALL_API_KEY:NO_KEY}
football.api.host=v3.football.api-sports.io

# API Features Control
# 안전을 위해 기본값은 false로 설정합니다. (개발 시 .env나 실행 인자로 제어 가능)
atleti.news.enabled.twitter=${ENABLED_TWITTER:true}
atleti.news.enabled.football=${ENABLED_FOOTBALL:true}
atleti.news.enabled.news=${ENABLED_NEWS:true}
atleti.news.enabled.gemini=${ENABLED_GEMINI:true}
atleti.news.enabled.youtube=${ENABLED_YOUTUBE:true}
atleti.news.enabled.headline=${ENABLED_HEADLINE:true}


# 2026 Atletico Madrid News Keywords
atleti.news.keywords=atleti,atletico, Atlético de Madrid, Atlético, simeone,cholo,rojiblanco,metropolitano,atm,fichaje,mercado,official,exclusiva,\
  alvarez,julian, Julián, Álvarez, sorloth,griezmann,llorente,koke,oblak,barrios,le normand,gimenez, lookman, jonny cardoso, ruggeri,obed, obed vargas, nico Gonzalez\
  molina,kostis,giuliano,mendoza, baena, almada, pubill, hancko, juan musso, julio diaz, lenglet, \
  saul, godin, gabi, Fernando Torres, Luis Aragones, Falcao, Deigo Costa, Filipe Luis, carrasco


<!DOCTYPE html>
<!-- Phase 2a 개발용 테스트 페이지 — 실제 프론트는 별도 레포에서 구현 예정 -->
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>채팅 테스트</title>
  <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 2rem auto; }
    #log { border: 1px solid #ccc; height: 300px; overflow-y: auto; padding: 8px; margin: 1rem 0; }
    #log p { margin: 2px 0; }
    input, button { padding: 6px; }
    #status { font-weight: bold; }
  </style>
</head>
<body>
  <h3>매치데이 채팅 테스트 <small>(v4 — 이 표시가 안 보이면 Ctrl+F5)</small></h3>
  <div>
    방 번호: <input id="matchId" value="1" size="4">
    닉네임: <input id="nickname" value="테스터" size="10">
    <button id="connectBtn" onclick="connect()">접속</button>
    <span id="status">⚪ 미접속</span>
  </div>
  <div id="log"></div>
  <div>
    <input id="content" size="40" placeholder="메시지 입력 후 Enter"
           onkeydown="if(event.key==='Enter') send()">
    <button onclick="send()">전송</button>
  </div>

  <script>
    let stomp = null;

    function appendMessage(msg) {
      const p = document.createElement('p');
      // ipHash: 같은 사람은 항상 같은 4자리 — 닉네임이 달라도 동일인 식별 가능
      const tag = msg.ipHash ? ' [' + msg.ipHash + ']' : '';
      p.textContent = msg.nickname + tag + ': ' + msg.content;
      const log = document.getElementById('log');
      log.appendChild(p);
      log.scrollTop = log.scrollHeight;
    }

    async function connect() {
      // 접속 진행 중 연타 방지 — 동시에 두 번 연결되면 구독이 중복된다
      const btn = document.getElementById('connectBtn');
      btn.disabled = true;
      // 재접속 시 기존 연결을 먼저 끊는다 — 안 끊으면 구독이 쌓여서
      // 같은 메시지가 구독 수만큼 중복 표시됨
      if (stomp) {
        try { stomp.disconnect(); } catch (e) {}
        stomp = null;
        document.getElementById('status').textContent = '⚪ 미접속';
      }
      const matchId = document.getElementById('matchId').value;
      // ⓪ 입장 전에 방 정보(오픈 여부/접속자 수/최근 메시지)를 REST로 먼저 로딩
      const room = await fetch('/api/chat/' + matchId).then(r => r.json());
      document.getElementById('log').innerHTML = '';
      room.messages.forEach(appendMessage);
      // ① 핸드셰이크: /ws로 접속 (SockJS가 WebSocket 안 되면 자동 fallback)
      stomp = Stomp.over(new SockJS('/ws'));
      stomp.connect({}, () => {
        btn.disabled = false;
        document.getElementById('status').textContent =
          '🟢 접속됨 (방 ' + matchId + ', 나 포함 ' + (room.onlineCount + 1) + '명' + (room.open ? '' : ', 방 닫힘') + ')';
        // ② 구독: 이 방의 방송 채널을 듣기 시작
        stomp.subscribe('/topic/chat/' + matchId, (frame) => {
          appendMessage(JSON.parse(frame.body));
        });
        // ③ 개인 에러 채널 구독: 정책 위반(닫힌 방, 도배 등) 시 나에게만 오는 안내
        stomp.subscribe('/user/queue/errors', (frame) => {
          const p = document.createElement('p');
          p.style.color = 'red';
          p.textContent = '⚠️ ' + JSON.parse(frame.body).error;
          const log = document.getElementById('log');
          log.appendChild(p);
          log.scrollTop = log.scrollHeight;
        });
      });
    }

    function send() {
      const input = document.getElementById('content');
      if (!stomp || !input.value.trim()) return;
      const matchId = document.getElementById('matchId').value;
      // ③ 발행: 서버의 @MessageMapping("/chat/{matchId}")로 전송
      stomp.send('/app/chat/' + matchId, {}, JSON.stringify({
        nickname: document.getElementById('nickname').value,
        content: input.value
      }));
      input.value = '';
    }
  </script>
</body>
</html>

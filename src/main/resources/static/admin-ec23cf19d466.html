<!DOCTYPE html>
<!--
  채팅 관리자 페이지 — 매치데이에 도배/문제 유저를 IP로 차단하기 위한 화면.

  이 페이지 자체는 누구나 열 수 있다(정적 파일). 대신 모든 요청에 X-Admin-Key 헤더가 붙고,
  서버가 .env의 ADMIN_KEY와 대조해 틀리면 403을 준다. 즉 화면이 아니라 API가 잠겨 있다.
  키는 이 브라우저의 localStorage에만 저장되며 서버로는 요청 헤더로만 전달된다.

  외부 라이브러리를 쓰지 않는다 — 관리자 화면이 CDN 장애나 차단에 영향받으면 곤란하기 때문.
-->
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- 검색엔진에 색인되지 않게 — 이 페이지가 검색 결과에 뜨면 감춘 의미가 없다.
       robots.txt에 Disallow로 적는 방식은 오히려 경로를 공개하는 셈이라 쓰지 않는다. -->
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>채팅 관리자</title>
  <style>
    :root { color-scheme: light dark; }
    body { font-family: system-ui, -apple-system, "Malgun Gothic", sans-serif;
           max-width: 860px; margin: 1.5rem auto; padding: 0 1rem; line-height: 1.5; }
    h3 { margin: 0 0 .25rem; }
    .sub { color: #777; font-size: .85rem; margin-bottom: 1.25rem; }
    fieldset { border: 1px solid #ccc; border-radius: 6px; margin-bottom: 1rem; padding: .75rem 1rem; }
    legend { font-weight: bold; font-size: .9rem; padding: 0 .35rem; }
    input { padding: 6px; font-size: 1rem; }
    button { padding: 6px 12px; font-size: .9rem; cursor: pointer; }
    button:disabled { opacity: .5; cursor: default; }
    table { border-collapse: collapse; width: 100%; margin-top: .5rem; }
    th, td { border: 1px solid #ddd; padding: 6px 8px; text-align: left; font-size: .9rem; }
    th { background: rgba(128,128,128,.12); }
    td.mono { font-family: ui-monospace, Consolas, monospace; }
    .empty { color: #888; font-size: .9rem; padding: .5rem 0; }
    .danger { color: #b00; }
    #msg { padding: .6rem .8rem; border-radius: 6px; margin-bottom: 1rem; display: none; }
    #msg.err { display: block; background: #fdecea; color: #7f1d1d; }
    #msg.ok  { display: block; background: #e8f5e9; color: #1b5e20; }
    .row { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; }
    .tag-banned { color: #b00; font-weight: bold; }
  </style>
</head>
<body>
  <h3>채팅 관리자</h3>
  <div class="sub">참가자를 찾아 IP로 차단한다. 차단된 IP는 메시지 전송과 닉네임 선점이 거부되며, 읽기는 계속 가능하다.</div>

  <div id="msg"></div>

  <fieldset>
    <legend>관리자 키</legend>
    <div class="row">
      <input id="adminKey" type="password" size="34" placeholder="서버 .env의 ADMIN_KEY">
      <button onclick="saveKey()">저장</button>
      <button onclick="clearKey()">지우기</button>
      <span id="keyState" class="sub" style="margin:0"></span>
    </div>
    <div class="sub" style="margin:.5rem 0 0">이 브라우저에만 저장된다. 공용 PC에서는 사용 후 지울 것.</div>
  </fieldset>

  <fieldset>
    <legend>방</legend>
    <div class="row">
      방 번호(matchId): <input id="matchId" size="12" value="1">
      <button id="loadBtn" onclick="loadAll()">불러오기</button>
      <label><input type="checkbox" id="autoRefresh" onchange="toggleAuto()"> 5초마다 자동 새로고침</label>
    </div>
    <div id="roomInfo" class="sub" style="margin:.5rem 0 0">—</div>
  </fieldset>

  <fieldset>
    <legend>참가자</legend>
    <div class="sub" style="margin:0">이 방에서 닉네임을 정한 사람 전체(나간 사람 포함). 방과 함께 24시간 뒤 사라진다.</div>
    <div id="participants"><div class="empty">불러오기를 눌러주세요.</div></div>
  </fieldset>

  <fieldset>
    <legend>차단된 IP</legend>
    <div class="sub" style="margin:0">방과 무관한 전역 목록이며, 수동 해제 전까지 영구 유지된다.</div>
    <div id="banned"><div class="empty">불러오기를 눌러주세요.</div></div>
  </fieldset>

  <script>
    const KEY_STORAGE = 'atleti.chat.adminKey';
    let autoTimer = null;

    // --- 관리자 키 ---

    function key() { return document.getElementById('adminKey').value.trim(); }

    function saveKey() {
      if (!key()) return show('키가 비어 있습니다.', 'err');
      localStorage.setItem(KEY_STORAGE, key());
      renderKeyState();
      show('키를 저장했습니다.', 'ok');
    }

    function clearKey() {
      localStorage.removeItem(KEY_STORAGE);
      document.getElementById('adminKey').value = '';
      renderKeyState();
      show('키를 지웠습니다.', 'ok');
    }

    function renderKeyState() {
      const saved = localStorage.getItem(KEY_STORAGE);
      document.getElementById('keyState').textContent = saved ? '저장됨' : '미저장';
    }

    // --- 공통 요청 — 모든 관리자 API에 키 헤더를 붙인다 ---

    async function api(path, options) {
      const res = await fetch(path, Object.assign({}, options, {
        headers: Object.assign({ 'X-Admin-Key': key() }, (options || {}).headers)
      }));
      if (res.status === 403) throw new Error('관리자 키가 올바르지 않습니다. 서버 .env의 ADMIN_KEY와 같은 값인지, 앱을 재시작했는지 확인하세요.');
      if (!res.ok) throw new Error('요청 실패 (HTTP ' + res.status + ')');
      return res;
    }

    function show(text, kind) {
      const box = document.getElementById('msg');
      box.textContent = text;
      box.className = kind;
      if (kind === 'ok') setTimeout(() => { box.className = ''; }, 3000);
    }

    // --- 불러오기 ---

    async function loadAll() {
      if (!key()) return show('먼저 관리자 키를 입력하세요.', 'err');
      const btn = document.getElementById('loadBtn');
      btn.disabled = true;
      try {
        await Promise.all([loadRoom(), loadParticipants(), loadBanned()]);
        document.getElementById('msg').className = '';
      } catch (e) {
        show(e.message, 'err');
        stopAuto();
      } finally {
        btn.disabled = false;
      }
    }

    function matchId() { return encodeURIComponent(document.getElementById('matchId').value.trim()); }

    // 방 정보는 공개 API — 키가 필요 없다 (오픈 여부/접속자 수 확인용)
    async function loadRoom() {
      const room = await fetch('/api/chat/' + matchId()).then(r => r.json());
      document.getElementById('roomInfo').textContent =
        (room.open ? '🟢 열림' : '⚪ 닫힘') + ' · 접속자 ' + room.onlineCount + '명 · 최근 메시지 ' + room.messages.length + '건';
    }

    async function loadParticipants() {
      const list = await (await api('/api/admin/chat/' + matchId() + '/participants')).json();
      const box = document.getElementById('participants');
      if (!list.length) {
        box.innerHTML = '<div class="empty">아직 참가자가 없습니다.</div>';
        return;
      }
      const rows = list.map(p =>
        '<tr>' +
          '<td>' + escapeHtml(p.nickname) + '</td>' +
          '<td class="mono">' + escapeHtml(p.ipHash) + '</td>' +
          '<td class="mono">' + escapeHtml(p.ip) + '</td>' +
          '<td>' + (p.banned ? '<span class="tag-banned">차단됨</span>' : '') + '</td>' +
          '<td>' + (p.banned
            ? '<button onclick="unban(\'' + escapeAttr(p.ip) + '\')">해제</button>'
            : '<button class="danger" onclick="ban(\'' + escapeAttr(p.ip) + '\', \'' + escapeAttr(p.nickname) + '\')">차단</button>') +
          '</td>' +
        '</tr>').join('');
      box.innerHTML =
        '<table><thead><tr><th>닉네임</th><th>ipHash</th><th>IP</th><th>상태</th><th></th></tr></thead>' +
        '<tbody>' + rows + '</tbody></table>';
    }

    async function loadBanned() {
      const ips = await (await api('/api/admin/chat/ban')).json();
      const box = document.getElementById('banned');
      if (!ips.length) {
        box.innerHTML = '<div class="empty">차단된 IP가 없습니다.</div>';
        return;
      }
      const rows = ips.map(ip =>
        '<tr><td class="mono">' + escapeHtml(ip) + '</td>' +
        '<td><button onclick="unban(\'' + escapeAttr(ip) + '\')">해제</button></td></tr>').join('');
      box.innerHTML = '<table><thead><tr><th>IP</th><th></th></tr></thead><tbody>' + rows + '</tbody></table>';
    }

    // --- 차단 / 해제 ---

    async function ban(ip, nickname) {
      if (!confirm('[' + nickname + '] ' + ip + ' 을(를) 차단할까요?\n이 IP는 메시지 전송과 닉네임 선점이 거부됩니다.')) return;
      try {
        await api('/api/admin/chat/ban?ip=' + encodeURIComponent(ip), { method: 'POST' });
        show('차단 완료: ' + ip, 'ok');
        await Promise.all([loadParticipants(), loadBanned()]);
      } catch (e) { show(e.message, 'err'); }
    }

    async function unban(ip) {
      try {
        await api('/api/admin/chat/ban?ip=' + encodeURIComponent(ip), { method: 'DELETE' });
        show('차단 해제: ' + ip, 'ok');
        await Promise.all([loadParticipants(), loadBanned()]);
      } catch (e) { show(e.message, 'err'); }
    }

    // --- 자동 새로고침 ---

    function toggleAuto() {
      if (document.getElementById('autoRefresh').checked) {
        autoTimer = setInterval(loadAll, 5000);
        loadAll();
      } else {
        stopAuto();
      }
    }

    function stopAuto() {
      if (autoTimer) clearInterval(autoTimer);
      autoTimer = null;
      document.getElementById('autoRefresh').checked = false;
    }

    // 닉네임은 사용자 입력이므로 그대로 HTML에 넣지 않는다 (스크립트 삽입 방지)
    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c =>
        ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }
    function escapeAttr(s) { return escapeHtml(s).replace(/\\/g, '\\\\'); }

    // 저장된 키 복원
    (function init() {
      const saved = localStorage.getItem(KEY_STORAGE);
      if (saved) document.getElementById('adminKey').value = saved;
      renderKeyState();
    })();
  </script>
</body>
</html>

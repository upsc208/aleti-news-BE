# H2 Database Configuration
# 파일을 사용자 홈 디렉토리 하위의 atleti 폴더에 저장하도록 변경 (권한 문제 방지)
spring.datasource.url=jdbc:h2:~/atleti/atletidb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_UPPER=FALSE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# 로컬 개발은 경기 채팅방도 기본 오픈 (킥오프 시간을 기다릴 필요 없음).
# 하드코딩이 아니라 placeholder라 CHAT_ALWAYS_OPEN=false로 실제 킥오프 규칙을 로컬에서 검증할 수 있다.
atleti.chat.always-open=${CHAT_ALWAYS_OPEN:true}

# 로컬 관리자 키 (운영은 .env의 무작위 값)
atleti.admin.key=local-admin

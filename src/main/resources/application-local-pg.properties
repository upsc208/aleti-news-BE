spring.application.name=atleti-news

# Local PostgreSQL Test Configuration
# 로컬에 설치된 PostgreSQL 설정을 여기에 작성합니다.
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driverClassName=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Gemini & RapidAPI (기존 환경 변수 활용)
gemini.api.key=${GEMINI_API_KEY:NO_KEY}
rapidapi.key=${RAPIDAPI_KEY:NO_KEY}
rapidapi.twitter.host=twitter-api45.p.rapidapi.com
rapidapi.football.host=free-api-live-football-data.p.rapidapi.com
rapidapi.daily.limit=45

# CI/CD 파이프라인 — 설계 문서: docs/ci-cd-design.md
#
# - PR: 빌드 + 테스트만 실행 (머지 관문)
# - master push: 빌드 + 테스트 성공 시 OCI 서버에 자동 배포
#   배포 로직(백업→교체→재시작→헬스체크→롤백)은 서버의 deploy.sh가 담당.
#   이 워크플로는 "빌드하고, 파일 보내고, 스크립트 실행"만 함.

name: CI/CD

on:
  pull_request:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 코드 받기
      - uses: actions/checkout@v4

      # Java 21 설치 (build.gradle.kts의 toolchain과 동일 버전)
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Gradle 의존성 캐싱 — 두 번째 실행부터 빌드 시간 단축
      - uses: gradle/actions/setup-gradle@v4

      # 빌드 + 테스트 (테스트는 h2 프로파일이라 외부 DB/API 키 불필요)
      - name: Build & test
        run: ./gradlew build

      # 배포용 jar 보관 — deploy job이 내려받아 서버로 전송
      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: |
            build/libs/*.jar
            !build/libs/*-plain.jar
          retention-days: 7

  deploy:
    runs-on: ubuntu-latest
    needs: build                # build 성공이 전제 조건
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    # 배포 중 또 push해도 중단 없이 순서대로 (동시 배포 방지)
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      # deploy.sh 최신본을 함께 전송하기 위해 코드 받기
      - uses: actions/checkout@v4

      # build job이 올려둔 jar 내려받기
      - uses: actions/download-artifact@v4
        with:
          name: app-jar

      # SSH 준비: 개인 키 복원 + 서버 호스트 키 등록
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.OCI_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.OCI_HOST }}" >> ~/.ssh/known_hosts

      # jar와 deploy.sh 전송
      - name: Transfer files
        run: |
          scp -i ~/.ssh/deploy_key news-*.jar "${{ secrets.OCI_USER }}@${{ secrets.OCI_HOST }}:/opt/atleti-news/app-new.jar"
          scp -i ~/.ssh/deploy_key infra/deploy.sh "${{ secrets.OCI_USER }}@${{ secrets.OCI_HOST }}:/opt/atleti-news/deploy.sh"

      # 배포 실행 — 헬스체크 실패 시 deploy.sh가 롤백하고 실패 코드 반환 → 여기가 ❌로 표시됨
      - name: Deploy
        run: ssh -i ~/.ssh/deploy_key "${{ secrets.OCI_USER }}@${{ secrets.OCI_HOST }}" "chmod +x /opt/atleti-news/deploy.sh && /opt/atleti-news/deploy.sh"

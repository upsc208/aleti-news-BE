# CI/CD 파이프라인 — 설계 문서: docs/ci-cd-design.md
#
# 지금은 build job(CI)만 있음. 로드맵 4단계에서 deploy job(CD)이 추가될 예정.
# - PR: 빌드 + 테스트만 실행 (머지 관문)
# - master push: 빌드 + 테스트 (추후 성공 시 배포까지)

name: CI/CD

on:
  pull_request:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 코드 받기
      - uses: actions/checkout@v4

      # Java 21 설치 (build.gradle.kts의 toolchain과 동일 버전)
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Gradle 의존성 캐싱 — 두 번째 실행부터 빌드 시간 단축
      - uses: gradle/actions/setup-gradle@v4

      # 빌드 + 테스트 (테스트는 h2 프로파일이라 외부 DB/API 키 불필요)
      - name: Build & test
        run: ./gradlew build

      # 배포용 jar 보관 — 추후 deploy job이 내려받아 서버로 전송
      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: |
            build/libs/*.jar
            !build/libs/*-plain.jar
          retention-days: 7

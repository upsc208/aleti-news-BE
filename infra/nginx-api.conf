# Nginx 리버스 프록시 설정 — api.atleti.kr
#
# 설치 위치: /etc/nginx/sites-available/default
#            (/etc/nginx/sites-enabled/default 로 심볼릭 링크)
# 적용:      sudo nginx -t && sudo systemctl reload nginx   (reload는 무중단)
#
# ⚠️ 2026-09-07 — 이 설정은 현재 운영 트래픽 경로에 없다.
#   Cloudflare -> Nginx(:80) -> Spring(:8080) 인 줄 알았는데, tcpdump로 보니
#   Cloudflare가 :8080 에 직접 붙는다. Nginx는 :80 에서 취약점 스캐너만 받고 있다.
#   따라서 아래 /ws 설정은 운영 동작에 영향을 준 적이 없다 (채팅은 Spring이
#   직접 처리해 처음부터 정상이었다). 자세한 경위는 docs/server-setup.md 9장.
#
#   결정 대기: Nginx를 실제 경로에 넣을지(Cloudflare를 :80 으로), 걷어낼지.
#   어느 쪽이든 앱 포트는 Cloudflare에서 오는 것만 받게 제한해야 한다.
#
# 이 파일을 레포에 두는 이유 —
#   systemd 유닛과 deploy.sh는 버전 관리되는데 nginx 설정만 서버에만 있었다.
#   설정도 코드처럼 레포에 두고, 바꿀 때는 여기부터 고친다.
#
server {
    listen 80;
    server_name api.atleti.kr; # 이 부분이 핵심입니다!

    # STOMP over WebSocket 핸드셰이크 경로 (SockJS 폴백 경로도 /ws 하위로 들어온다)
    # 이 블록이 없으면 Upgrade 헤더가 백엔드로 전달되지 않아 WebSocket 승격이 실패하고,
    # SockJS가 조용히 HTTP 폴링으로 폴백한다 (기능은 되지만 지연·부하가 커진다).
    location /ws {
        proxy_pass http://localhost:8080;

        # 연결 승격에 반드시 필요한 세 줄
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 유휴 타임아웃 — 기본 60초라 대화가 잠깐 끊기면 연결이 죽는다.
        # 경기 한 판(전·후반 + 하프타임)을 덮도록 넉넉히 잡는다.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://localhost:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

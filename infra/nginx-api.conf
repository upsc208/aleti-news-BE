# Nginx 리버스 프록시 설정 — api.atleti.kr
#
# 설치 위치: /etc/nginx/sites-available/default
#            (/etc/nginx/sites-enabled/default 로 심볼릭 링크)
# 적용:      sudo nginx -t && sudo systemctl reload nginx   (reload는 무중단)
#
# 이 파일을 레포에 두는 이유 —
#   systemd 유닛과 deploy.sh는 버전 관리되는데 nginx 설정만 서버에만 있었다.
#   그래서 docs/server-setup.md 9장에 적어 둔 WebSocket 설정이 실서버에 반영되지
#   않은 채로 넉 달간 방치됐다 (SockJS 폴백이 대신 동작해 티가 안 났다).
#   설정도 코드처럼 레포에 두고, 바꿀 때는 여기부터 고친다.
#
server {
    listen 80;
    server_name api.atleti.kr; # 이 부분이 핵심입니다!

    # STOMP over WebSocket 핸드셰이크 경로 (SockJS 폴백 경로도 /ws 하위로 들어온다)
    # 이 블록이 없으면 Upgrade 헤더가 백엔드로 전달되지 않아 WebSocket 승격이 실패하고,
    # SockJS가 조용히 HTTP 폴링으로 폴백한다 (기능은 되지만 지연·부하가 커진다).
    location /ws {
        proxy_pass http://localhost:8080;

        # 연결 승격에 반드시 필요한 세 줄
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 유휴 타임아웃 — 기본 60초라 대화가 잠깐 끊기면 연결이 죽는다.
        # 경기 한 판(전·후반 + 하프타임)을 덮도록 넉넉히 잡는다.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://localhost:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
